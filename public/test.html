<html><head><script src="https://unpkg.com/react@18.3.0/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18.3.0/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/arche@1.0.0/index.js"></script><script src="https://unpkg.com/styled-components@6.1.19/dist/styled-components.min.js"></script></head><body><script type="module">const inspect = function (value, depth = 0) {
  const inspectDeeper = item => inspect(item, depth + 1)
  if (Array.isArray(value)) {
    return `[${value.map(inspectDeeper).join(', ')}]`
  }
  if (ArrayBuffer.isView(value)) {
    return `${value.constructor.name} [${value.join(', ')}]`
  }
  if (typeof value == 'string') {
    return depth == 0 ? value : `'${value}'`
  }
  if (value == null) {
    return `${value}`
  }
  if (value.constructor == Set) {
    if (value.size == 0) {
      return 'Set {}'
    }
    let result = `Set { `
    const resultValues = []
    for (const item of value) {
      resultValues.push(inspectDeeper(item))
    }
    result += resultValues.join(', ')
    result += ' }'
    return result
  }
  if (value.constructor == Map) {
    if (value.size == 0) {
      return 'Map {}'
    }
    let result = 'Map { '
    const entries = []
    for (const [key, item] of value) {
      entries.push(`${inspectDeeper(key)} => ${inspectDeeper(item)}`)
    }
    result += entries.join(', ')
    result += ' }'
    return result
  }
  if (value.constructor == Object) {
    if (Object.keys(value).length == 0) {
      return '{}'
    }
    let result = '{ '
    const entries = []
    for (const key in value) {
      entries.push(`${key}: ${inspectDeeper(value[key])}`)
    }
    result += entries.join(', ')
    result += ' }'
    return result
  }
  if (value instanceof Error) {
    return `${value.name}: ${value.message}`
  }
  return `${value}`
}

const codeArea = document.createElement('code')
codeArea.style.fontSize = '1.25em'
const panel = document.createElement('pre')
codeArea.appendChild(panel)
document.body.appendChild(panel)

const console = {
  log: (...msgs) => {
    panel.innerHTML += msgs.map(inspect).join(' ')
    panel.innerHTML += '\n'
  },
}
console.error = console.log

const parentOrigin = 'http://localhost:4507'

const domContainer = document.createElement('div')
domContainer.id = 'dom-container'
document.body.appendChild(domContainer)

const reactRoot = document.createElement('div')
reactRoot.id = 'react-root'
document.body.appendChild(reactRoot)

;(async function () {
  try {
    const ReactElement = Arche(React, { styled })
const { Div, H1, P }

const MyComponent = ReactElement(() => {
  return Div({
    css: `
      height: 500px;
      width: 100%;
      background-color: pink;
    `,
  }, [
    H1('Styled Example')
    P('Text'),
  ])
})

ReactDOM.render(MyComponent(), document.getElementById('react-root'))
  } catch (e) {
    console.log(e)
  }
})()

document.body.onload = () => {
  const body = document.body
  const html = document.documentElement

  const height = Math.max(
    body.scrollHeight, 
    body.offsetHeight,
    html.clientHeight, 
    html.scrollHeight, 
    html.offsetHeight
  )

  window.parent.postMessage({ height }, parentOrigin)
}</script></body></html>
